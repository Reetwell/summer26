<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a3b2c" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#F1EDE3"/>
  <g fill="#177A5B" filter="url(#sh)">
    <!-- top bowl: flat left, rounded right -->
    <path d="M360 250 q0 -8 8 -8 h210 a125 125 0 0 1 0 250 h-210 q-8 0 -8 -8 Z"/>
  </g>
  <!-- bottom bowl: wider, tucked slightly under with its own shadow -->
  <g fill="#177A5B" filter="url(#sh)">
    <path d="M360 516 q0 -8 8 -8 h250 a132 132 0 0 1 0 264 h-250 q-8 0 -8 -8 Z"/>
  </g>
  <!-- subtle overlap tuck shadow where bowls meet -->
  <path d="M360 516 h250 a132 132 0 0 1 12 8 l-40 -40 a125 125 0 0 0 -12 -8 h-210 Z" fill="#0d5f47" opacity="0.25"/>
</svg>
